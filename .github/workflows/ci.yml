name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      matrix:
        profile: [FULL_BUNDLED, BUNDLED_YTDLP_SYSTEM_PYTHON, SYSTEM_YTDLP_SYSTEM_PYTHON]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned yt-dlp on the embed interpreter
        if: matrix.profile == 'SYSTEM_YTDLP_SYSTEM_PYTHON'
        run: |
          PIN=$(python - <<'PY'
          import tomllib
          deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']
          print([d for d in deps if d.startswith('yt-dlp==')][0].split('==')[1])
          PY
          )
          python -m pip install "yt-dlp==$PIN"
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPython_EXECUTABLE="$(which python)" \
            -DLIBYTDLP_DEPLOYMENT_PROFILE=${{ matrix.profile }}
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python-versions:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPython_EXECUTABLE="$(which python)" \
            -DLIBYTDLP_DEPLOYMENT_PROFILE=FULL_BUNDLED
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: ./dev bump-version --check

  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - name: Configure, build and test under UBSan
        run: |
          cmake -S . -B build -G Ninja -DLIBYTDLP_SANITIZE_UNDEFINED=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: ./fmt --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Configure and build native lib
        run: |
          cmake -S . -B build -G Ninja -DPython_EXECUTABLE="$(which python)"
          cmake --build build --parallel
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check formatting
        working-directory: .
        run: cargo +nightly fmt --all -- --check
      - name: Clippy
        working-directory: .
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        working-directory: .
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo build --locked
      - name: Test
        working-directory: .
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --locked
      - name: Build and test resolve example
        working-directory: examples/resolve
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: |
          cargo build --locked
          cargo test --locked

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Rust tests
        working-directory: .
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --locked

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Rust dependencies
        run: |
          (cd bindings/rust && cargo fetch --locked)
          (cd examples/resolve && cargo fetch --locked)
      - name: Produce SBOM
        run: ./dev sbom --out sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Enforce licenses
        run: ./dev sbom --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
      - name: Configure and build native lib
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --parallel
      - name: Check bindings against minimum toolchain
        working-directory: .
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo check --locked --all-targets
      - name: Check resolve example against minimum toolchain
        working-directory: examples/resolve
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo check --locked --all-targets

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Expose DLL to test processes
        shell: pwsh
        run: echo "${{ github.workspace }}\build" | Out-File -Append $env:GITHUB_PATH
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Install
        run: cmake --install build --prefix staged
      - name: Rust tests
        working-directory: .
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Rust tests
        working-directory: .
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --locked
