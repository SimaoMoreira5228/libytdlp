name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - uses: astral-sh/setup-uv@v6
      - name: Sync Python env
        run: uv sync --locked
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: ./dev bump-version --check

  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - uses: astral-sh/setup-uv@v6
      - name: Configure, build and test under UBSan
        run: |
          cmake -S . -B build -G Ninja -DLIBYTDLP_SANITIZE_UNDEFINED=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: ./fmt --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Sync Python env
        run: uv sync --locked
      - name: Configure and build native lib
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --parallel
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check formatting
        working-directory: bindings/rust
        run: cargo +nightly fmt --check
      - name: Clippy
        working-directory: bindings/rust
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        working-directory: bindings/rust
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo build --locked
      - name: Test
        working-directory: bindings/rust
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --locked
      - name: Build and test resolve example
        working-directory: examples/resolve
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: |
          cargo build --locked
          cargo test --locked

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - name: Sync Python env
        run: uv sync --locked
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Rust dependencies
        run: |
          (cd bindings/rust && cargo fetch --locked)
          (cd examples/resolve && cargo fetch --locked)
      - name: Produce SBOM
        run: ./dev sbom --out sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Enforce licenses
        run: ./dev sbom --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
      - name: Configure and build native lib
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --parallel
      - name: Check bindings against minimum toolchain
        working-directory: bindings/rust
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo check --locked --all-targets
      - name: Check resolve example against minimum toolchain
        working-directory: examples/resolve
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo check --locked --all-targets

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync Python env
        run: uv sync --locked
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Expose DLL to test processes
        shell: pwsh
        run: echo "${{ github.workspace }}\build" | Out-File -Append $env:GITHUB_PATH
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Rust tests
        working-directory: bindings/rust
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync Python env
        run: uv sync --locked
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Probe fixture speed
        run: |
          echo "--- python startup ---"
          time python3 -c "pass"
          echo "--- fixture spawn + download ---"
          python3 tests/fixtures/slow_server.py 0 65536 8000000 > /tmp/probe_port.txt 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q PORT /tmp/probe_port.txt 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat /tmp/probe_port.txt
          PORT=$(awk '{print $2}' /tmp/probe_port.txt)
          time curl -s -o /tmp/probe_out.bin "http://127.0.0.1:${PORT}/file.bin"
          ls -l /tmp/probe_out.bin
          kill $SERVER_PID
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300 -V -R "smoke|jobs"
      - name: Rust tests
        working-directory: bindings/rust
        env:
          LIBYTDLP_LIB_DIR: ${{ github.workspace }}/build
        run: cargo test --locked
