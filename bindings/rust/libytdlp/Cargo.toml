[package]
name = "libytdlp"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Safe Rust wrapper around the libytdlp C ABI"
repository = "https://github.com/SimaoMoreira5228/libytdlp"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libytdlp-sys = { version = "0.5.0", path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
