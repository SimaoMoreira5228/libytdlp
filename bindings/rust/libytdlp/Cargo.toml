[package]
name = "libytdlp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Safe Rust wrapper around the libytdlp C ABI"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libytdlp-sys = { version = "0.1.0", path = "../libytdlp-sys" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
